<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<title>Průvod králů – profilová fotka Facebooku</title>
<link href="pisma/pisma.css" rel="stylesheet">
<style>
/* Plátno 720 × 720 px. Facebook ho ořízne do kruhu, rohy nejsou vidět. */
:root { --navy:#1C244B; --navy-deep:#0F1430; --gold:#D3A451; --gold-deep:#9B6C1B; }
html,body { margin:0; }
.platno { width:720px; height:720px; position:relative; overflow:hidden;
  background: radial-gradient(circle at 50% 42%, #2a3466 0%, var(--navy) 45%, var(--navy-deep) 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; }
.kruh { position:absolute; inset:22px; border-radius:50%; border:6px solid var(--gold);
  box-shadow: inset 0 0 0 10px rgba(211,164,81,.18); }
.koruna { width:400px; filter: drop-shadow(0 8px 12px rgba(0,0,0,.5)); }
body[data-text] .koruna { width:340px; margin-top:-30px; }
.nazev { display:none; font-family:'Uncial Antiqua', serif; font-size:58px; line-height:1;
  color:var(--gold); -webkit-text-stroke:1.5px var(--gold-deep);
  text-shadow:0 3px 0 rgba(110,75,16,.55), 0 8px 18px rgba(0,0,0,.5); margin-top:18px; }
body[data-text] .nazev { display:block; }
/* kontrolní kruh ořezu – jen při ?zona */
.zona { display:none; position:absolute; inset:0; border-radius:50%; outline:3px dashed #ff4d4d; }
body[data-zona] .zona { display:block; }
</style></head>
<body>
<div class="platno">
  <div class="kruh"></div>
  <img class="koruna" src="koruna.svg" alt="">
  <div class="nazev">Průvod králů</div>
  <div class="zona"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has('text')) document.body.dataset.text = '';
  if (q.has('zona')) document.body.dataset.zona = '';
</script>
</body></html>
