<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<title>Průvod králů – profilová fotka Facebooku</title>
<style>
/* Profilová fotka = favicon webu: zlatá koruna na tmavě modré #1C244B.
   720 × 720 px; Facebook ji ořízne do kruhu, koruna drží odstup od okraje. */
html,body { margin:0; }
.platno { width:720px; height:720px; background:#1C244B; display:grid; place-items:center; position:relative; }
.koruna { width:430px; height:auto; margin-top:-10px; }
.zona { display:none; position:absolute; inset:0; border-radius:50%; outline:3px dashed #ff4d4d; }
body[data-zona] .zona { display:block; }
</style></head>
<body>
<div class="platno"><img class="koruna" src="../koruna.svg" alt=""><div class="zona"></div></div>
<script>if (new URLSearchParams(location.search).has('zona')) document.body.dataset.zona = '';</script>
</body></html>
