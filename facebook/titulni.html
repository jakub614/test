<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<title>Průvod králů – titulní fotka Facebooku</title>
<link href="pisma/pisma.css" rel="stylesheet">
<style>
/* Titulní fotka = hero úvodní stránky webu (fotka, koruna, nápis, claim).
   Plátno 1640 × 924 px (16 : 9) – stejný poměr jako fotka hero.
   Mobil ukáže celé plátno, počítač jen pás y 158–766; značka leží v něm,
   nad hlavami účinkujících, stejně jako na webu. */
html,body { margin:0; }
.platno { width:1640px; height:924px; position:relative; overflow:hidden;
  background:#1C244B url("../hero-1536.webp") center / cover no-repeat; }
.znacka { position:absolute; left:0; right:0; top:172px;
  display:flex; flex-direction:column; align-items:center; text-align:center; }
.koruna { height:112px; width:auto; filter:drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
h1 { font-family:'Uncial Antiqua', serif; font-weight:400; margin:6px 0 0; line-height:1;
  font-size:112px; color:#E7AC44; -webkit-text-stroke:1.5px #9B6C1B;
  text-shadow:0 3px 12px rgba(0,0,0,.65); }
.claim { font-family:'Spectral SC', serif; font-weight:500; font-size:42px; line-height:1.2;
  color:#F2E0C8; margin:14px 0 0; text-shadow:0 2px 10px rgba(0,0,0,.75); }
.zona { display:none; position:absolute; left:0; right:0; top:158px; height:608px; outline:3px dashed #ff4d4d; }
body[data-zona] .zona { display:block; }
</style></head>
<body>
<div class="platno">
  <div class="znacka">
    <img class="koruna" src="../koruna.svg" alt="">
    <h1>Průvod Králů</h1>
    <p class="claim">České dějiny kráčí ulicemi</p>
  </div>
  <div class="zona"></div>
</div>
<script>if (new URLSearchParams(location.search).has('zona')) document.body.dataset.zona = '';</script>
</body></html>
